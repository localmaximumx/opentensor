<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="otLightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="otCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="otSlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="otBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Isometric Tensor Cube -->
  <!-- Top Face -->
  <polygon points="50,14 82,32 50,50 18,32" fill="url(#otLightBlueGrad)" opacity="0.96" />
  
  <!-- Left Face -->
  <polygon points="18,32 50,50 50,86 18,68" fill="url(#otCyanGrad)" opacity="0.92" />
  
  <!-- Right Face -->
  <polygon points="50,50 82,32 82,68 50,86" fill="url(#otSlateGrad)" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Inner Tensor Matrix Wireframe / Grid Lines -->
  <!-- Top Face Grid -->
  <line x1="34" y1="23" x2="66" y2="41" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
  <line x1="66" y1="23" x2="34" y2="41" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

  <!-- Left Face Matrix Vectors -->
  <line x1="18" y1="50" x2="50" y2="68" stroke="#E0F2FE" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
  <line x1="34" y1="41" x2="34" y2="77" stroke="#E0F2FE" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />

  <!-- Neural Tensor Vertices / Nodes -->
  <circle cx="50" cy="14" r="3.5" fill="#FFFFFF" filter="url(#otBlueGlow)" />
  <circle cx="82" cy="32" r="3" fill="#7DD3FC" />
  <circle cx="18" cy="32" r="3" fill="#BAE6FD" />
  <circle cx="50" cy="50" r="4.2" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5" filter="url(#otBlueGlow)" />
  <circle cx="18" cy="68" r="3" fill="#0284C7" />
  <circle cx="82" cy="68" r="3" fill="#38BDF8" />
  <circle cx="50" cy="86" r="3.5" fill="#0EA5E9" />
</svg>
